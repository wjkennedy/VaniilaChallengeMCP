openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla Locales API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: Locales
paths:
  /locales:
    get:
      summary: Get all enabled locales on the site
      tags:
      - Locales
      responses:
        '200':
          description: A list of enabled locales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Locale'
      x-addon: dashboard
      parameters:
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      operationId: getLocales
      x-operation-id-source: derived
    post:
      tags:
      - Locales
      parameters:
      - $ref: '#/components/parameters/LocaleCodeParameter'
      - $ref: '#/components/parameters/TranslatableParameter'
      responses:
        '200':
          description: The specified locale information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleConfig'
      x-addon: dashboard
      summary: Create locales
      x-summary-source: derived
      operationId: postLocales
      x-operation-id-source: derived
  /locales/{locale}:
    get:
      summary: Get single locale
      tags:
      - Locales
      parameters:
      - $ref: '#/components/parameters/LocaleCodeParameter'
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: The specified locale information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleConfig'
      x-addon: dashboard
      operationId: getLocalesByLocale
      x-operation-id-source: derived
    patch:
      tags:
      - Locales
      parameters:
      - $ref: '#/components/parameters/LocaleCodeParameter'
      responses:
        '200':
          description: The specified locale information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleConfig'
      x-addon: dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationServiceType'
      summary: Update locales by locale
      x-summary-source: derived
      operationId: patchLocalesByLocale
      x-operation-id-source: derived
components:
  parameters:
    TranslatableParameter:
      name: translatable
      in: query
      description: Whether or not to mark this locale as translatable by machine translations.
      required: false
      schema:
        type: boolean
      x-addon: dashboard
    LocaleCodeParameter:
      name: locale
      in: path
      description: The locale code requested.
      required: true
      schema:
        type: string
        pattern: '[a-zA-Z0-9-]+'
      x-addon: dashboard
  schemas:
    Locale:
      properties:
        localeID:
          description: The key of the locale addon.
          minLength: 1
          type: string
          example: vf_fr_CA,
        localeKey:
          description: The normalized key of the locale without any regional modifier.
          type: string
          example: fr
        regionalKey:
          description: The normalized key of the locale with a regional modifier if it exists.
          type: string
          example: fr_CA
        displayNames:
          type: object
          description: Translatable names of the
          example:
            en: French
            fr: Français
            de: Französisch
      type: object
      x-addon: dashboard
    LocaleConfig:
      allOf:
      - $ref: '#/components/schemas/Locale'
      - $ref: '#/components/schemas/TranslationServiceType'
      x-addon: dashboard
x-resourceEvents:
  emailTemplates:
    x-feature: Feature.emailTemplates.Enabled
    name: Email Template
    type: emailTemplate
  notification:
    x-addon: dashboard
    name: Notification
    type: notification
  reaction:
    name: Reaction
    type: reaction
  user:
    x-addon: dashboard
    name: User
    type: user
  comment:
    x-addon: vanilla
    name: Comment
    type: comment
  discussion:
    x-addon: vanilla
    name: Discussion
    type: discussion
  escalation:
    x-addon: vanilla
    name: Escalation
    type: cmdEscalation
  report:
    x-addon: vanilla
    name: Report
    type: report
  userNote:
    x-addon: warnings2
    name: User Note
    type: userNote
x-aliases:
  AssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
  StringAssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
    data:
      type: string
      description: Contents of the asset. May require an expand parameter to retreive.
    '200':
      content:
        application/json:
          schema:
            description: Contents of an asset.
            type: object
            properties:
              type:
                description: The type of the asset.
                type: string
                example: html
                enum:
                - html
                - css
                - js
              data:
                type: string
                example: <header>Hello Footer<footer />
                description: Contents of the asset. May require an expand parameter to retreive.
              content-type:
                description: The content-type of the asset.
                type: string
                example: text/html
              url:
                type: string
                description: Absolute URL of the resource.
                example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
      description: Success
  ThemeSlug:
    description: Unique theme slug.
    in: path
    name: themeID
    required: true
    schema:
      type: string
  AssetNotFound:
    description: JavaScript could not be found.
    content:
      application/json:
        schema:
          type: object
          properties:
            description:
              description: Verbose description of the error.
              type:
              - string
              - 'null'
            message:
              description: Short description of the error.
              type: string
            status:
              description: Status code of the error response.
              type: integer
          required:
          - description
          - message
          - status
  ThemeIDParam:
    description: Unique themeID.
    in: path
    name: themeID
    required: true
    schema:
      type: integer
  StringAssetIn:
    description: An asset to be inserted.
    type: object
    properties:
      type:
        description: The type of the asset.
        type: string
        example: html
        enum:
        - html
        - css
        - js
      data:
        type: string
        example: <header>Hello Footer<footer />
        description: Contents of the asset. May require an expand parameter to retreive.
  JsonAssetIn:
    description: An asset to be inserted.
    type: object
    properties:
      type:
        type: string
        example: json
      data:
        type: object
        description: JSON content of the asset.
        example:
          global:
            mainColors:
              primary: '#5cc530'
  JsonAssetOut:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                example: json
              data:
                type: object
                description: JSON content of the asset.
                example:
                  global:
                    mainColors:
                      primary: '#5cc530'
              content-type:
                description: The content-type of the asset.
                type: string
                example: application/json
              url:
                type: string
                description: Absolute URL of the resource.
                example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
      description: Success
  DeleteAsset:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
      schema:
        type: integer
    responses:
      '204':
        description: Success
    tags:
    - Theme Assets
    summary: Delete theme asset.
  StringPutAsset:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
      schema:
        type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: An asset to be inserted.
            type: object
            properties:
              type:
                description: The type of the asset.
                type: string
                example: html
                enum:
                - html
                - css
                - js
              data:
                type: string
                example: <header>Hello Footer<footer />
                description: Contents of the asset. May require an expand parameter to retreive.
    responses:
      '200':
        content:
          application/json:
            schema:
              description: Contents of an asset.
              type: object
              properties:
                type:
                  description: The type of the asset.
                  type: string
                  example: html
                  enum:
                  - html
                  - css
                  - js
                data:
                  type: string
                  example: <header>Hello Footer<footer />
                  description: Contents of the asset. May require an expand parameter to retreive.
                content-type:
                  description: The content-type of the asset.
                  type: string
                  example: text/html
                url:
                  type: string
                  description: Absolute URL of the resource.
                  example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
        description: Success
    tags:
    - Theme Assets
    summary: Set theme asset or replace if already exists.
  HtmlPutAssetContentType:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
      schema:
        type: integer
    requestBody:
      required: true
      content:
        text/html:
          schema:
            type: string
            description: HTML contents.
            example: <div>Hello HTML Asset!</div>
    responses:
      '200':
        content:
          text/html:
            schema:
              type: string
              description: HTML contents.
              example: <div>Hello HTML Asset!</div>
        description: Success
    tags:
    - Theme Assets
    summary: Set theme asset or replace if already exists.
  JsPutAssetContentType:
