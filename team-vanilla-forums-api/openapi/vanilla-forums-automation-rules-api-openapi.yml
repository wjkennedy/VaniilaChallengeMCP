openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla Automation Rules API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: Automation Rules
paths:
  /automation-rules/dispatches:
    x-hidden: false
    get:
      summary: Get automation rule execution history
      tags:
      - Automation Rules
      parameters:
      - name: automationRuleID
        description: 'The automation Rule ID.

          '
        in: query
        required: false
        schema:
          type: integer
      - name: automationRuleDispatchUUID
        description: Filter by automationRuleDispatchUUID.
        in: query
        schema:
          type: string
      - name: actionType
        description: Filter by actionType
        in: query
        schema:
          type: string
      - name: dispatchStatus
        description: Filter by automation rule dispatch status.
        in: query
        schema:
          items:
            enum:
            - queued
            - running
            - success
            - warning
            - failed
            type: string
          type: array
        style: form
      - name: dateUpdated
        description: Filter by dateUpdated. See [date filters](https://docs.vanillaforums.com/help/apiv2/date-filters/).
        in: query
        schema:
          format: date-filter
          type: string
      - name: dateLastRun
        description: Filter by dateLastRun. See [date filters](https://docs.vanillaforums.com/help/apiv2/date-filters/).
        in: query
        schema:
          format: date-filter
          type: string
      - name: dateFinished
        description: Filter by dateFinished. See [date filters](https://docs.vanillaforums.com/help/apiv2/date-filters/).
        in: query
        schema:
          format: date-filter
          type: string
      - $ref: '#/components/parameters/Page'
      - name: limit
        in: query
        description: Desired number of items per page.
        schema:
          type: integer
          default: 30
          maximum: 100
          minimum: 1
      - name: expand
        description: Expand fields on the result.
        in: query
        schema:
          items:
            enum:
            - insertUser
            - updateUser
            - all
            - insertUser.ssoID
            - insertUser.roles
            - insertUser.profileFields
            - insertUser.extended
            - updateUser.ssoID
            - updateUser.roles
            - updateUser.profileFields
            - updateUser.extended
            type: string
          type: array
        style: form
      - name: sort
        description: The results' sort order.
        in: query
        schema:
          type: array
          items:
            type: string
            example: -dateDispatched
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AutomationDispatch'
          description: Success
        '403':
          $ref: '#/components/responses/PermissionError'
      x-addon: dashboard
      operationId: getAutomationRulesDispatches
      x-operation-id-source: derived
