openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla Resources API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: Resources
paths:
  /resources:
    get:
      summary: List the resources available on the site
      tags:
      - Resources
      parameters:
      - name: crawlable
        in: query
        schema:
          type: boolean
          description: Filter by resources that have crawling information.
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceFragment'
              example:
              - recordType: user
                url: https://example.com/api/v2/resources/user
                crawlable: true
              - recordType: discussion
                url: https://example.com/api/v2/resources/discussion
                crawlable: true
              - recordType: comment
                url: https://example.com/api/v2/resources/comment
                crawlable: true
        '403':
          $ref: '#/components/responses/PermissionError'
      x-addon: dashboard
      operationId: getResources
      x-operation-id-source: derived
  /resources/dirty-records/{recordType}:
    delete:
      summary: Delete resources dirty records
      tags:
      - Resources
      parameters:
      - name: recordType
        description: The record type slug of the resource.
        in: path
        required: true
        schema:
          type: string
          example: discussion
      - name: dateInserted
        description: Date to filter records by.
        in: query
        schema:
          type: string
      responses:
        '204':
          description: Success
      x-addon: dashboard
      operationId: deleteResourcesDirtyRecordsByRecordType
      x-operation-id-source: derived
  /resources/{recordType}:
    get:
      summary: Get the details of a resource
      tags:
      - Resources
      parameters:
      - name: recordType
        description: The record type slug of the resource.
        in: path
        required: true
        schema:
          type: string
          example: discussion
      - name: expand
        description: Expand fields on the result.
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - all
            - crawl
        style: form
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '403':
          $ref: '#/components/responses/PermissionError'
      x-addon: dashboard
      operationId: getResourcesByRecordType
      x-operation-id-source: derived
components:
  schemas:
    ResourceFragment:
      description: Meta information about a resource.
      type: object
      properties:
        recordType:
          type: string
          description: The record the resource represents. Also the unique ID of the resource.
        url:
          type: string
          description: The URL of the resource meta information.
          format: uri
        crawlable:
          type: boolean
          description: Whether or not the resource has crawl information.
      required:
      - recordType
      - url
      - crawlable
      x-addon: dashboard
    Resource:
      type: object
      properties:
        recordType:
          type: string
          description: The record the resource represents. Also the unique ID of the resource.
        crawl:
          type: object
          properties:
            url:
              type: string
              description: The URL template used to crawl the resource.
              format: uri
            min:
              description: The minimum parameter value for crawling the resource.
              oneOf:
              - type: number
                format: int32
              - type: string
                format: date-time
            max:
              description: The maximum parameter value for crawling the resource.
              oneOf:
              - type: number
                format: int32
              - type: string
                format: date-time
            count:
              type: number
              format: int32
              description: The approximate number of rows the resource has.
            parameter:
              type: string
              description: The name of the parameter you need to pass to the crawl URL.
          required:
          - url
          - min
          - max
          - count
          - parameter
      required:
      - recordType
      example:
        recordType: discussion
        crawl:
          url: https://example.com/api/v2/discussions?expand=crawl?order=-discussionID
          min: 1,
          max: 500000,
          count: 499560,
          parameter: discussionID
      x-addon: dashboard
  responses:
    PermissionError:
      description: Permission denied.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            - status
            - permissions
            properties:
              message:
                type: string
                description: A message that tells you the permissions you need.
                example: Permission denied.
              status:
                type: integer
                description: The HTTP status code for the error.
                format: int32
                example: 403
              permissions:
                description: The permissions the requesting user is missing.
                type: array
                items:
                  type: string
              recordIDs:
                description: The recordIDs the user didn't have permission on.
                type: array
                items:
                  type: integer
          example:
            status: 403
            message: Permission Problem
            permissions:
            - Vanilla.Discussions.Edit
            - Vanilla.Community.Manage
            recordIDs:
            - 2425
            - 1342
      x-addon: dashboard
x-resourceEvents:
  emailTemplates:
    x-feature: Feature.emailTemplates.Enabled
    name: Email Template
    type: emailTemplate
  notification:
    x-addon: dashboard
    name: Notification
    type: notification
  reaction:
    name: Reaction
    type: reaction
  user:
    x-addon: dashboard
    name: User
    type: user
  comment:
    x-addon: vanilla
    name: Comment
    type: comment
  discussion:
    x-addon: vanilla
    name: Discussion
    type: discussion
  escalation:
    x-addon: vanilla
    name: Escalation
    type: cmdEscalation
  report:
    x-addon: vanilla
    name: Report
    type: report
  userNote:
    x-addon: warnings2
    name: User Note
    type: userNote
x-aliases:
  AssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
  StringAssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
    data:
      type: string
      description: Contents of the asset. May require an expand parameter to retreive.
    '200':
      content:
        application/json:
          schema:
            description: Contents of an asset.
            type: object
            properties:
              type:
                description: The type of the asset.
                type: string
                example: html
                enum:
                - html
                - css
                - js
              data:
                type: string
                example: <header>Hello Footer<footer />
                description: Contents of the asset. May require an expand parameter to retreive.
              content-type:
                description: The content-type of the asset.
                type: string
                example: text/html
              url:
                type: string
                description: Absolute URL of the resource.
                example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
      description: Success
  ThemeSlug:
    description: Unique theme slug.
    in: path
    name: themeID
    required: true
    schema:
      type: string
  AssetNotFound:
    description: JavaScript could not be found.
    content:
      application/json:
        schema:
          type: object
          properties:
            description:
              description: Verbose description of the error.
              type:
              - string
              - 'null'
            message:
              description: Short description of the error.
              type: string
            status:
              description: Status code of the error response.
              type: integer
          required:
          - description
          - message
          - status
  ThemeIDParam:
    description: Unique themeID.
    in: path
    name: themeID
    required: true
    schema:
      type: integer
  StringAssetIn:
    description: An asset to be inserted.
    type: object
    properties:
      type:
        description: The type of the asset.
        type: string
        example: html
        enum:
        - html
        - css
        - js
      data:
        type: string
        example: <header>Hello Footer<footer />
        description: Contents of the asset. May require an expand parameter to retreive.
  JsonAssetIn:
    description: An asset to be inserted.
    type: object
    properties:
      type:
        type: string
        example: json
      data:
        type: object
        description: JSON content of the asset.
        example:
          global:
            mainColors:
              primary: '#5cc530'
  JsonAssetOut:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                example: json
              data:
                type: object
                description: JSON content of the asset.
                example:
                  global:
                    mainColors:
                      primary: '#5cc530'
              content-type:
                description: The content-type of the asset.
                type: string
                example: application/json
              url:
                type: string
                description: Absolute URL of the resource.
                example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
      description: Success
  DeleteAsset:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
      schema:
        type: integer
    responses:
      '204':
        description: Success
    tags:
    - Theme Assets
    summary: Delete theme asset.
  StringPutAsset:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
      schema:
        type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: An asset to be inserted.
            type: object
            properties:
              type:
                description: The type of the asset.
                type: string
                example: html
                enum:
                - html
                - css
                - js
              data:
                type: string
                example: <header>Hello Footer<footer />
                description: Contents of the asset. May require an expand parameter to retreive.
    responses:
      '200':
        content:
          application/json:
            schema:
              description: Contents of an asset.
              type: object
              properties:
                type:
                  description: The type of the asset.
                  type: string
                  example: html
                  enum:
                  - html
                  - css
                  - js
                data:
                  type: string
                  example: <header>Hello Footer<footer />
                  description: Contents of the asset. May require an expand parameter to retreive.
                content-type:
                  description: The content-type of the asset.
                  type: string
                  example: text/html
                url:
                  type: string
                  description: Absolute URL of the resource.
                  example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
        description: Success
    tags:
    - Theme Assets
    summary: Set theme asset or replace if already exists.
  HtmlPutAssetContentType:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
