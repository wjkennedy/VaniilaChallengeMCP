  /themes/{themeID}/assets/footer:
    get:
      parameters:
      - description: Unique theme slug.
        in: path
        name: themeID
        required: true
        schema:
          type: string
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeFooterAsset'
          description: Success
        '404':
          description: JavaScript could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    description: Verbose description of the error.
                    type:
                    - string
                    - 'null'
                  message:
                    description: Short description of the error.
                    type: string
                  status:
                    description: Status code of the error response.
                    type: integer
                required:
                - description
                - message
                - status
      tags:
      - Theme Assets
      summary: Get the footer HTML of a theme
      x-addon: dashboard
      operationId: getThemesByThemeIDAssetsFooter
      x-operation-id-source: derived
    put:
      parameters:
      - description: Unique themeID.
        in: path
        name: themeID
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: An asset to be inserted.
              type: object
              properties:
                type:
                  description: The type of the asset.
                  type: string
                  example: html
                  enum:
                  - html
                  - css
                  - js
                data:
                  type: string
                  example: <header>Hello Footer<footer />
                  description: Contents of the asset. May require an expand parameter to retreive.
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Contents of an asset.
                type: object
                properties:
                  type:
                    description: The type of the asset.
                    type: string
                    example: html
                    enum:
                    - html
                    - css
                    - js
                  data:
                    type: string
                    example: <header>Hello Footer<footer />
                    description: Contents of the asset. May require an expand parameter to retreive.
