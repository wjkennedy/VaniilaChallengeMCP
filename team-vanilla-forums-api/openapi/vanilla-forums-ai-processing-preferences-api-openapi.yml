openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla AI Processing Preferences API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: AI Processing Preferences
paths:
  /ai-processing-preferences/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      x-addon: dashboard
    get:
      summary: Get a user's AI processing preferences
      tags:
      - AI Processing Preferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProcessingPreferences'
        '401':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/NotFound'
      x-addon: dashboard
      parameters:
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      operationId: getAiProcessingPreferencesById
      x-operation-id-source: derived
    patch:
      summary: Update a user's AI processing preferences
      tags:
      - AI Processing Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProcessingPreferences'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProcessingPreferences'
        '401':
          $ref: '#/components/responses/PermissionError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/NotFound'
      x-addon: dashboard
      operationId: patchAiProcessingPreferencesById
      x-operation-id-source: derived
components:
  schemas:
    AiProcessingPreferences:
      type: object
      description: User's AI processing preferences values. Preference names are shortened (e.g., "enabled" instead of "preferences.aiProcessing.enabled").
      properties:
        enabled:
          type: boolean
          description: Global toggle for enabling AI processing of user content.
        sentimentAnalysis:
          type: boolean
          description: Allow sentiment analysis and keyword tracking on posts.
        receiveSuggestedAnswers:
          type: boolean
          description: Allow AI to suggest answers to questions.
        assistedSearch:
          type: boolean
          description: Allow AI-assisted search features.
        contentReuse:
          type: boolean
          description: Allow AI to use content to help others.
        aiTranslations:
          type: boolean
          description: Allow AI translations of content.
      x-addon: dashboard
  responses:
    NotFound:
      description: The record does not exist or was not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: More information about the error.
              status:
                type: number
                description: The HTTP status code for the error.
                format: int32
            required:
            - message
          example:
            status: 404
            message: Page Not Found
      x-addon: dashboard
    PermissionError:
      description: Permission denied.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            - status
            - permissions
            properties:
              message:
                type: string
                description: A message that tells you the permissions you need.
                example: Permission denied.
              status:
                type: integer
                description: The HTTP status code for the error.
                format: int32
                example: 403
              permissions:
                description: The permissions the requesting user is missing.
                type: array
                items:
                  type: string
              recordIDs:
                description: The recordIDs the user didn't have permission on.
                type: array
                items:
                  type: integer
          example:
            status: 403
            message: Permission Problem
            permissions:
            - Vanilla.Discussions.Edit
            - Vanilla.Community.Manage
            recordIDs:
            - 2425
            - 1342
      x-addon: dashboard
x-resourceEvents:
  emailTemplates:
    x-feature: Feature.emailTemplates.Enabled
    name: Email Template
    type: emailTemplate
  notification:
    x-addon: dashboard
    name: Notification
    type: notification
  reaction:
    name: Reaction
    type: reaction
  user:
    x-addon: dashboard
    name: User
    type: user
  comment:
    x-addon: vanilla
    name: Comment
    type: comment
  discussion:
    x-addon: vanilla
    name: Discussion
    type: discussion
  escalation:
    x-addon: vanilla
    name: Escalation
    type: cmdEscalation
  report:
    x-addon: vanilla
    name: Report
    type: report
  userNote:
    x-addon: warnings2
    name: User Note
    type: userNote
