openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla Calls API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: Calls
paths:
  /calls/run:
    post:
      summary: Continue running a callbackPayload from a previous API call
      description: 'Various endoints may return a 202 status response with

        `callbackPayload` property in the body. Simply pass that

        response to this endpoint to continue processing.


        Endpoints with responses like this are structured as follows:

        1. Call other endpoint.

        2. Endpoint may return 202 with "callbackPayload" and progress.

        3. Pass the callback payload to this endpoint.

        4. This endpoint may return a 202 with another `callbackPayload`

        5. Repeat until task is complete.'
      tags:
      - Calls
      requestBody:
        required: true
        description: 'A secured JWT token containing:

          - The original request userID.

          - Instructions for the server on how to resume the original task.

          - Context about the result of previous attempts.


          The only way to get one of these payloads is to have it returned

          from an /api/v2 endpoint as a `callbackPayload`.

          '
        content:
          application/system+jwt:
            schema:
              type: string
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c

                '
      responses:
        '200':
          $ref: '#/components/responses/LongRunnerResponse'
        '408':
          $ref: '#/components/responses/LongRunnerResponse'
      x-addon: dashboard
      operationId: postCallsRun
      x-operation-id-source: derived
components:
  schemas:
    LongRunnerProgress:
      description: Progress of the task.
      type: object
      required:
      - successIDs
      - failedIDs
      - exceptionsByID
      properties:
        successIDs:
          description: 'The IDs of records for which an action has succeeded.

            '
          example:
          - 25
          - 145
          - 11431
          - 1313
          type: array
          items:
            type: integer
        failedIDs:
          description: 'The IDs of records for which and action has failed.

            '
          example:
          - 14424
          - 1264524
          type: array
          items:
            type: integer
        exceptionsByID:
          description: Detailed errors by failedID during the action.
          example:
            '14424':
              message: Discussions of type "redirect" can't be moved.
              code: 400
          type: object
          required:
          - message
          - type
          properties:
            message:
              type: string
            code:
              type: number
        countTotalIDs:
          description: Total count of records that can be progressed.
          type: integer
      x-addon: dashboard
    LongRunnerResult:
      description: 'Endpoints will return this if they may time out and require the client

        to progress the task with additional requests.

        '
      type: object
      required:
      - progress
      - callbackPayload
      properties:
        callbackPayload:
          description: 'A signed JWT payload to pass to the /api/v2/calls endpoint in order to continue

            progression of the task.

            '
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c

            '
        progress:
          $ref: '#/components/schemas/LongRunnerProgress'
      x-addon: dashboard
  responses:
    LongRunnerResponse:
      description: 'Endpoints that may time out and require the client to

        progress them with the `/api/v2/calls` endpoints may return this.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LongRunnerResult'
      x-addon: dashboard
