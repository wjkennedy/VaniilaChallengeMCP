openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla Site Totals API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: Site Totals
paths:
  /site-totals:
    get:
      summary: Get a list of site-total counts
      tags:
      - Site Totals
      parameters:
      - name: siteSectionID
        description: Get the counts only for a specific site section (subcommunity).
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/SiteTotalsCounts'
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteTotalsCountsResponseFields'
          description: Success
      x-addon: dashboard
      operationId: getSiteTotals
      x-operation-id-source: derived
components:
  schemas:
    SiteTotalsCountsResponseFields:
      type: object
      properties:
        siteSectionID:
          type: integer
        counts:
          type: object
          properties:
            customPage:
              $ref: '#/components/schemas/Count'
            question:
              $ref: '#/components/schemas/Count'
            accepted:
              $ref: '#/components/schemas/Count'
            category:
              $ref: '#/components/schemas/Count'
            discussion:
              $ref: '#/components/schemas/Count'
            comment:
              $ref: '#/components/schemas/Count'
            post:
              $ref: '#/components/schemas/Count'
            user:
              $ref: '#/components/schemas/Count'
      x-addon: dashboard
    Count:
      type: object
      properties:
        count:
          type: integer
        isCalculating:
          type: boolean
          description: Whether the value is currently being calculated.
        isFiltered:
          type: boolean
          description: Indicates whether the count value has been filtered by siteSection
      x-addon: dashboard
  parameters:
    SiteTotalsCounts:
      name: counts
      description: Choose the site counts you want by choosing one or more valid field names. Choosing "all" will return all available counts.
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
          - customPage
          - question
          - accepted
          - category
          - discussion
          - comment
          - post
          - user
          - all
      style: form
      x-addon: dashboard
x-resourceEvents:
  emailTemplates:
    x-feature: Feature.emailTemplates.Enabled
    name: Email Template
    type: emailTemplate
  notification:
    x-addon: dashboard
    name: Notification
    type: notification
  reaction:
    name: Reaction
    type: reaction
  user:
    x-addon: dashboard
    name: User
    type: user
  comment:
    x-addon: vanilla
    name: Comment
    type: comment
  discussion:
    x-addon: vanilla
    name: Discussion
    type: discussion
  escalation:
    x-addon: vanilla
    name: Escalation
    type: cmdEscalation
  report:
    x-addon: vanilla
    name: Report
    type: report
  userNote:
    x-addon: warnings2
    name: User Note
    type: userNote
x-aliases:
  AssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
  StringAssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
    data:
      type: string
      description: Contents of the asset. May require an expand parameter to retreive.
    '200':
      content:
        application/json:
          schema:
            description: Contents of an asset.
            type: object
            properties:
              type:
                description: The type of the asset.
                type: string
                example: html
                enum:
                - html
                - css
                - js
              data:
                type: string
                example: <header>Hello Footer<footer />
                description: Contents of the asset. May require an expand parameter to retreive.
              content-type:
                description: The content-type of the asset.
                type: string
                example: text/html
              url:
                type: string
                description: Absolute URL of the resource.
                example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
      description: Success
  ThemeSlug:
    description: Unique theme slug.
    in: path
    name: themeID
    required: true
    schema:
      type: string
  AssetNotFound:
    description: JavaScript could not be found.
    content:
      application/json:
        schema:
          type: object
          properties:
            description:
              description: Verbose description of the error.
              type:
              - string
              - 'null'
            message:
              description: Short description of the error.
              type: string
            status:
              description: Status code of the error response.
              type: integer
          required:
          - description
          - message
          - status
  ThemeIDParam:
    description: Unique themeID.
    in: path
    name: themeID
    required: true
    schema:
