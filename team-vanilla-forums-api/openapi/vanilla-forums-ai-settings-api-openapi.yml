openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla AI Settings API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: AI Settings
paths:
  /ai-settings/bot-shield:
    get:
      summary: Get Bot Shield Settings
      tags:
      - AI Settings
      responses:
        '200':
          description: Bot Shield
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    description: Current status of AI Bot Shield for this site.
                    enum:
                    - disabled
                    - enabled
                    - partial
      x-addon: dashboard
      parameters:
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      operationId: getAiSettingsBotShield
      x-operation-id-source: derived
    post:
      summary: Update Bot Shield Settings
      tags:
      - AI Settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  description: New status of AI Bot Shield for this site.
                  enum:
                  - disabled
                  - enabled
      responses:
        '201':
          description: Bot Shield
      x-addon: dashboard
      operationId: postAiSettingsBotShield
      x-operation-id-source: derived
  /ai-settings/feature-notification-status:
    get:
      summary: Get AI feature notification status
      tags:
      - AI Settings
      responses:
        '200':
          description: Per-feature and aggregate notify state for the current enablement period.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabledFeatureKeys:
                    type: array
                    items:
                      type: string
                  canNotifyUsers:
                    type: boolean
                    description: True when at least one enabled feature has not been notified in the current enablement period.
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        featureKey:
                          type: string
                        enabled:
                          type: boolean
                        notifiedInCurrentPeriod:
                          type: boolean
                        dateLastNotified:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        featureNotificationDispatchID:
                          type:
                          - integer
                          - 'null'
                        lastDispatchStatus:
                          type:
                          - string
                          - 'null'
                          enum:
                          - pending
                          - complete
                          - failed
      x-addon: dashboard
      parameters:
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      operationId: getAiSettingsFeatureNotificationStatus
      x-operation-id-source: derived
  /ai-settings/feature-notifications:
    post:
      summary: Send AI feature disclosure notifications
      tags:
      - AI Settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
                  maxLength: 500
                format:
                  type: string
                  enum:
                  - text
      responses:
        '201':
          description: Notification dispatch accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  featureKeys:
                    type: array
                    items:
                      type: string
                  notifiedCount:
                    type: integer
                  status:
                    type: string
                    enum:
                    - pending
                    - complete
                    - failed
                  featureNotificationDispatchID:
                    type: integer
      x-addon: dashboard
      operationId: postAiSettingsFeatureNotifications
      x-operation-id-source: derived
x-resourceEvents:
  emailTemplates:
    x-feature: Feature.emailTemplates.Enabled
    name: Email Template
    type: emailTemplate
  notification:
    x-addon: dashboard
    name: Notification
    type: notification
  reaction:
    name: Reaction
    type: reaction
  user:
    x-addon: dashboard
    name: User
    type: user
  comment:
    x-addon: vanilla
    name: Comment
    type: comment
  discussion:
    x-addon: vanilla
    name: Discussion
    type: discussion
  escalation:
    x-addon: vanilla
    name: Escalation
    type: cmdEscalation
  report:
    x-addon: vanilla
    name: Report
    type: report
  userNote:
    x-addon: warnings2
    name: User Note
    type: userNote
x-aliases:
  AssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
  StringAssetOut:
    type:
      description: The type of the asset.
      type: string
    url:
      type: string
      description: Absolute URL of the asset.
    content-type:
      description: The content-type of the asset.
      type: string
      example: application/json
    data:
      type: string
      description: Contents of the asset. May require an expand parameter to retreive.
    '200':
      content:
        application/json:
          schema:
            description: Contents of an asset.
            type: object
            properties:
              type:
                description: The type of the asset.
                type: string
                example: html
                enum:
                - html
                - css
                - js
              data:
                type: string
                example: <header>Hello Footer<footer />
                description: Contents of the asset. May require an expand parameter to retreive.
              content-type:
                description: The content-type of the asset.
                type: string
                example: text/html
              url:
                type: string
                description: Absolute URL of the resource.
                example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
      description: Success
  ThemeSlug:
    description: Unique theme slug.
    in: path
    name: themeID
    required: true
    schema:
      type: string
  AssetNotFound:
    description: JavaScript could not be found.
    content:
      application/json:
        schema:
          type: object
          properties:
            description:
              description: Verbose description of the error.
              type:
              - string
              - 'null'
            message:
              description: Short description of the error.
              type: string
            status:
              description: Status code of the error response.
              type: integer
          required:
          - description
          - message
          - status
  ThemeIDParam:
    description: Unique themeID.
    in: path
    name: themeID
    required: true
    schema:
      type: integer
  StringAssetIn:
    description: An asset to be inserted.
    type: object
    properties:
      type:
        description: The type of the asset.
        type: string
        example: html
        enum:
        - html
        - css
        - js
      data:
        type: string
        example: <header>Hello Footer<footer />
        description: Contents of the asset. May require an expand parameter to retreive.
  JsonAssetIn:
    description: An asset to be inserted.
    type: object
    properties:
      type:
        type: string
        example: json
      data:
        type: object
        description: JSON content of the asset.
        example:
          global:
            mainColors:
              primary: '#5cc530'
  JsonAssetOut:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                type: string
                example: json
              data:
                type: object
                description: JSON content of the asset.
                example:
                  global:
                    mainColors:
                      primary: '#5cc530'
              content-type:
                description: The content-type of the asset.
                type: string
                example: application/json
              url:
                type: string
                description: Absolute URL of the resource.
                example: https://site.com/api/v2/themes/:themeID/assets/:assetName.ext?v=faasdf42d
      description: Success
  DeleteAsset:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
      schema:
        type: integer
    responses:
      '204':
        description: Success
    tags:
    - Theme Assets
    summary: Delete theme asset.
  StringPutAsset:
    parameters:
    - description: Unique themeID.
      in: path
      name: themeID
      required: true
      schema:
        type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: An asset to be inserted.
            type: object
            properties:
              type:
