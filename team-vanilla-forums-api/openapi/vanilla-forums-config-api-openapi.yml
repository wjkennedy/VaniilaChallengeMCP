openapi: 3.2.0
info:
  description: API access to your community.
  title: Vanilla Config API
  version: '2.0'
servers:
- url: https://open.vanillaforums.com/api/v2
tags:
- name: Config
paths:
  /config:
    get:
      summary: Get the site's config
      tags:
      - Config
      parameters:
      - name: select
        in: query
        description: 'A CSV of config key names to select a sparse set of items. Use * as a wildcard to match multiple keys.

          '
        style: form
        schema:
          type: array
          items:
            type: string
      - name: fields
        in: query
        style: form
        description: Only return fields with these keys from the output. Use dot notation for nested fields.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
          description: Success
      x-addon: dashboard
      operationId: getConfig
      x-operation-id-source: derived
    patch:
      summary: Update one or more config settings
      tags:
      - Config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '204':
          description: Success
      x-addon: dashboard
      operationId: patchConfig
      x-operation-id-source: derived
components:
  schemas:
    Config:
      type: object
      properties:
        configUUID:
          description: Used for internal configuration validation.
          type: string
          x-key: configUUID
          x-read: public
        branding.addressBarColor:
          description: 'Some browsers support a color for the address bar.

            '
          type: string
          default: ''
