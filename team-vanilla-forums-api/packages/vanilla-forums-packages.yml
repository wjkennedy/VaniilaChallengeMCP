description: >-
  First-party client libraries and developer packages published by Vanilla
  Forums (Higher Logic Vanilla). Vanilla ships no general-purpose REST API SDK;
  its first-party client libraries center on the jsConnect single sign-on
  protocol (clients for PHP, Java, Ruby, .NET, Python) plus the Garden PHP
  libraries the platform itself is built from. The main vanilla/vanilla open
  source repository was taken private after the Higher Logic acquisition; the
  packages below remain published and maintained on public registries.
