description: 'Higher Logic Vanilla operates an official MCP server ("Vanilla MCP"), announced May 26,
  2026. It gives customers a native Model Context Protocol connection between their Vanilla community
  and AI tools (ChatGPT, Claude, Cursor, and custom agents): query live community data conversationally,
  take approved actions, and drive AI automation. Vanilla positions it as a secure pass-through to the
  existing Vanilla API v2 — no new data or permissions are exposed; access is governed by existing Vanilla
  roles/permissions. Rollout is via a customer beta program; the server endpoint and connection details
  are distributed to customers (the configuration guides live behind the success community login), so
  no public endpoint URL is recorded here. Companion resources published: Vanilla MCP Customer FAQ and
  a Vanilla MCP Security Datasheet (architecture, authentication and access controls, data handling and
  retention).'
