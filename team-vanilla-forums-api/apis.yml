aid: vanilla-forums
name: Vanilla Forums
description: >-
  Vanilla Forums is the cloud community-forum platform now sold as Higher
  Logic Vanilla, powering B2B/B2C customer communities and association member
  communities. Every Vanilla community serves a REST API (API v2) at /api/v2
  with a per-site OpenAPI 3 description, personal-access-token and JWT bearer
  authentication, short-lived cacheable role tokens, webhooks with HMAC-signed
  deliveries, CSV export, and an official MCP server (launched May 2026) that
  connects AI tools like ChatGPT, Claude, and Cursor to live community data.
  Originally a Techstars-backed open source project, Vanilla was acquired by
  Higher Logic in 2021.
